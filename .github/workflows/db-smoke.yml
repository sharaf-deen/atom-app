name: DB Reset + Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: db-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SUPABASE_DB_ONLY: "true"
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Authenticate Docker to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset DB + Smoke
        run: npm run reset:smoke

      - name: Authenticated financial API E2E (isolated local Supabase only)
        env:
          ATOM_LOCAL_FINANCIAL_E2E: "1"
        run: node scripts/security-1c7-local-financial-auth-e2e.mjs

      # The versioned migration is applied by local 'supabase db reset' above.
      # Run finance regression fixtures only against that isolated PostgreSQL.
      # Never use remote database URLs or run these fixtures via cloud Supabase.
      - name: Isolated payment method correction migration smoke
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          if [ -z "$DB_CONTAINER" ]; then
            echo "Local Supabase database container not found"
            exit 1
          fi
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/subscription-payment-method-local-smoke.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/subscription-payment-method-business-local.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/subscription-payment-method-guards-local.sql
          bash scripts/tests/payment-correction-concurrency-local.sh "$DB_CONTAINER"
