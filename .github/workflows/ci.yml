name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

      - name: Staff Payroll coaching integrity contract
        run: node --test scripts/tests/staff-payroll-coaching-integrity.test.cjs

      - name: Staff Payroll WhatsApp intake contract
        run: node --test scripts/tests/staff-payroll-admin-whatsapp-intake.test.cjs

      - name: Banking 2I reconciliation contract
        run: node --test scripts/tests/banking-2i-bulk-contract.test.cjs

      - name: Banking 2J supervised bulk and CIB contract
        run: node --test scripts/tests/banking-2j-contract.test.cjs

      - name: Banking 2J.1 payer identification integrity
        run: node --test scripts/tests/banking-2j1-payer-hints.test.cjs

      - name: Banking 2J.2 triage worklist regression
        run: node --test scripts/tests/banking-2j2-triage.test.cjs

      - name: Subscription payment method integrity contracts
        run: |
          node --test scripts/tests/subscription-payment-integrity.contract.test.cjs
          node --test scripts/tests/subscription-payment-bank-match.integrity.test.cjs

      - name: Prospects WhatsApp assisted follow-up integrity
        run: node --test scripts/tests/prospects-whatsapp-assisted.contract.test.cjs

      - name: Meta WhatsApp Cloud API contracts
        run: node --test scripts/tests/crm-whatsapp-cloud-api.contract.test.cjs

      - name: Family duplicate recovery consolidated contract
        run: node --test scripts/tests/family-duplicate-recovery.contract.test.cjs

      - name: Reception four-action homepage contract
        run: node --test scripts/tests/reception-home-four-actions.contract.test.cjs

      - name: Build
        run: npm run build
