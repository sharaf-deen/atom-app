name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

      - name: Staff Payroll coaching integrity contract
        run: node --test scripts/tests/staff-payroll-coaching-integrity.test.cjs

      - name: Staff Payroll WhatsApp intake contract
        run: node --test scripts/tests/staff-payroll-admin-whatsapp-intake.test.cjs

      - name: Banking 2I reconciliation contract
        run: node --test scripts/tests/banking-2i-bulk-contract.test.cjs

      - name: Banking 2J supervised bulk and CIB contract
        run: node --test scripts/tests/banking-2j-contract.test.cjs

      - name: Banking 2J.1 payer identification integrity
        run: node --test scripts/tests/banking-2j1-payer-hints.test.cjs

      - name: Banking 2J.2 triage worklist regression
        run: node --test scripts/tests/banking-2j2-triage.test.cjs

      - name: Membership Upgrade V1 executable math and authorization contracts
        run: node --test scripts/tests/membership-upgrade-math.test.cjs

      - name: Membership Upgrade V1 invoice PDF and idempotency tests
        run: node --test scripts/tests/membership-upgrade-invoice.test.cjs

      - name: Subscription Edit — financial and contract integrity tests
        run: node --test scripts/tests/subscription-edit-integrity.test.cjs

      - name: Subscription payment method integrity contracts
        run: |
          node --test scripts/tests/subscription-payment-integrity.contract.test.cjs
          node --test scripts/tests/subscription-payment-bank-match.integrity.test.cjs

      - name: Prospects WhatsApp assisted follow-up integrity
        run: node --test scripts/tests/prospects-whatsapp-assisted.contract.test.cjs

      - name: Meta WhatsApp Cloud API contracts
        run: node --test scripts/tests/crm-whatsapp-cloud-api.contract.test.cjs

      - name: Family duplicate recovery consolidated contract
        run: node --test scripts/tests/family-duplicate-recovery.contract.test.cjs

      - name: Reception six-action homepage contract
        run: node --test scripts/tests/reception-home-four-actions.contract.test.cjs

      - name: Reception Registration Desk navigation contract
        run: node --test scripts/tests/reception-registrations-navigation.contract.test.cjs
      - name: Reception early renewal preview contract
        run: node --test scripts/tests/reception-early-renewal-preview.contract.test.cjs

      - name: Member ID 000595 controlled reissue contract
        run: node --test scripts/tests/member-000595-reissue.contract.test.cjs

      - name: Member 000593 controlled-release contract
        run: node --test scripts/tests/member-000593-controlled-release.contract.test.cjs

      - name: Member ID recovery consolidated audit and automation contracts
        run: node --test scripts/tests/member-id-recovery-audit.contract.test.cjs

      - name: Super Admin grouped admin workspace contract
        run: node --test scripts/tests/super-admin-home-admin-workspace.contract.test.cjs

      - name: Super Admin Program Health consolidated contract
        run: node --test scripts/tests/program-health-dashboard.contract.test.cjs

      - name: Super Admin Program Health score and retention contracts
        run: node --test scripts/tests/program-health-score.contract.test.cjs

      - name: Member subscription current and history contracts
        run: node --test scripts/tests/member-subscription-history.contract.test.cjs

      - name: Refund cancellation preserves contractual plan dates
        run: node --test scripts/tests/refund-cancel-preserve-contract-end.contract.test.cjs

      - name: Notifications lightweight cleanup and deletion integrity
        run: node --test scripts/tests/notifications-lightweight-cleanup.contract.test.cjs

      - name: Build
        run: npm run build
